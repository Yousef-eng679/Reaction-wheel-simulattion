<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reaction Wheel Attitude Control Simulator</title>
    <meta name="description" content="A physically accurate, real-time reaction wheel attitude control simulation. Tune PID gains, inject disturbances, and visualize sensor noise vs ground truth." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

      :root {
        --bg:          #0d0d11;
        --surface:     #15151d;
        --surface2:    #1c1c27;
        --border:      #2a2a3a;
        --text:        #e4e4f0;
        --text-dim:    #7a7a96;
        --accent:      #7c6eff;
        --accent2:     #34d399;
        --warn:        #f59e0b;
        --danger:      #f87171;
        --true-color:  #7c6eff;
        --est-color:   #34d399;
        --omega-color: #f59e0b;
        --rpm-color:   #60a5fa;
        --ctrl-color:  #f87171;
        --err-color:   #fb923c;
        font-size: 13px;
      }

      html, body { height: 100%; background: var(--bg); color: var(--text); font-family: 'Inter', system-ui, sans-serif; }

      #app {
        display: grid;
        grid-template-columns: 280px 1fr 300px;
        grid-template-rows: auto 1fr auto;
        grid-template-areas:
          "header  header  header"
          "panel   viz     charts"
          "panel   status  charts";
        height: 100vh;
        gap: 1px;
        background: var(--border);
        overflow: hidden;
      }

      /* ── Header ── */
      #header {
        grid-area: header;
        background: var(--surface);
        display: flex;
        align-items: center;
        gap: 1.5rem;
        padding: 0.6rem 1.2rem;
        border-bottom: 1px solid var(--border);
      }
      #header h1 {
        font-size: 1rem;
        font-weight: 600;
        letter-spacing: -0.01em;
        color: var(--text);
      }
      #header h1 span { color: var(--accent); }
      .header-readouts {
        display: flex;
        gap: 1.5rem;
        margin-left: auto;
        font-family: 'JetBrains Mono', monospace;
        font-size: 0.85rem;
      }
      .readout { display: flex; flex-direction: column; align-items: flex-end; gap: 0.1rem; }
      .readout-label { font-size: 0.65rem; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.06em; }
      .readout-value { font-size: 0.95rem; font-weight: 500; }
      .readout-value.true  { color: var(--true-color); }
      .readout-value.est   { color: var(--est-color); }
      .readout-value.omega { color: var(--omega-color); }
      .readout-value.rpm   { color: var(--rpm-color); }

      /* ── Toolbar ── */
      .toolbar { display: flex; gap: 0.5rem; margin-left: 1rem; }
      button {
        font-family: inherit;
        font-size: 0.78rem;
        font-weight: 500;
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 0.35rem 0.8rem;
        cursor: pointer;
        transition: background 0.15s, border-color 0.15s;
        background: var(--surface2);
        color: var(--text);
      }
      button:hover { background: var(--border); }
      button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
      button.primary:hover { background: #6b5de8; }
      button.danger  { background: var(--danger); border-color: var(--danger); color: #fff; }
      button.danger:hover  { background: #ef4444; }
      button.warn    { background: var(--warn);   border-color: var(--warn);   color: #000; }
      button.warn:hover    { background: #e08906; }

      /* ── Control Panel ── */
      #panel {
        grid-area: panel;
        background: var(--surface);
        overflow-y: auto;
        padding: 0.8rem;
        display: flex;
        flex-direction: column;
        gap: 0.6rem;
      }
      .section-title {
        font-size: 0.65rem;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--text-dim);
        padding: 0.2rem 0;
        border-bottom: 1px solid var(--border);
        margin-bottom: 0.2rem;
      }
      .param {
        display: flex;
        flex-direction: column;
        gap: 0.3rem;
      }
      .param-header {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
      }
      .param-label { font-size: 0.75rem; color: var(--text-dim); }
      .param-unit  { font-size: 0.65rem; color: #4a4a60; font-family: 'JetBrains Mono', monospace; }
      .param-value { font-family: 'JetBrains Mono', monospace; font-size: 0.8rem; color: var(--text); min-width: 4rem; text-align: right; }

      input[type="range"] {
        -webkit-appearance: none;
        width: 100%;
        height: 4px;
        border-radius: 2px;
        background: var(--border);
        outline: none;
      }
      input[type="range"]::-webkit-slider-thumb {
        -webkit-appearance: none;
        width: 14px; height: 14px;
        border-radius: 50%;
        background: var(--accent);
        cursor: pointer;
        transition: transform 0.1s;
      }
      input[type="range"]::-webkit-slider-thumb:hover { transform: scale(1.2); }

      input[type="number"] {
        font-family: 'JetBrains Mono', monospace;
        font-size: 0.8rem;
        background: var(--surface2);
        border: 1px solid var(--border);
        border-radius: 4px;
        color: var(--text);
        padding: 0.3rem 0.4rem;
        width: 100%;
        outline: none;
      }
      input[type="number"]:focus { border-color: var(--accent); }

      /* ── Visualization ── */
      #viz {
        grid-area: viz;
        background: var(--surface);
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        position: relative;
      }
      #canvas-main {
        display: block;
        max-width: 100%;
        max-height: 100%;
      }
      .sat-badge {
        position: absolute;
        top: 0.6rem;
        right: 0.6rem;
        background: var(--danger);
        color: #fff;
        font-size: 0.65rem;
        font-weight: 600;
        letter-spacing: 0.05em;
        padding: 0.2rem 0.5rem;
        border-radius: 4px;
        display: none;
      }
      .sat-badge.visible { display: block; }

      /* ── Status bar ── */
      #status {
        grid-area: status;
        background: var(--surface2);
        border-top: 1px solid var(--border);
        padding: 0.3rem 0.8rem;
        font-size: 0.7rem;
        font-family: 'JetBrains Mono', monospace;
        color: var(--text-dim);
        display: flex;
        gap: 1.5rem;
      }
      .status-item { display: flex; gap: 0.35rem; }
      .status-item span:first-child { color: #4a4a60; }

      /* ── Telemetry Charts ── */
      #charts {
        grid-area: charts;
        background: var(--surface);
        display: flex;
        flex-direction: column;
        overflow: hidden;
        padding: 0.5rem;
        gap: 0.4rem;
      }
      .chart-label {
        font-size: 0.65rem;
        color: var(--text-dim);
        font-family: 'JetBrains Mono', monospace;
        display: flex;
        justify-content: space-between;
      }
      .chart-label .chart-value { font-weight: 500; }
      canvas.chart-canvas {
        width: 100%;
        border-radius: 4px;
        background: var(--bg);
        display: block;
      }

      /* ── Legend ── */
      .legend {
        display: flex;
        gap: 0.8rem;
        flex-wrap: wrap;
        padding: 0.3rem 0;
      }
      .legend-item {
        display: flex;
        align-items: center;
        gap: 0.3rem;
        font-size: 0.65rem;
        color: var(--text-dim);
      }
      .legend-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        flex-shrink: 0;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
